<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SECSS - Gestión de Usuarios</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="Styles/style.css">
</head>

<body>

    <main class="container my-5">
        
        <div class="card-documento p-4 shadow bg-white">
            
            <nav class="navbar navbar-expand-lg bg-body-tertiary rounded mb-4">
                <div class="container-fluid">
                    <a class="navbar-brand fw-bold" href="#">SECSS</a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
<li class="nav-item dropdown">
    
    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        Registro
    </a>

    <ul class="dropdown-menu">
        <li>
            <a class="link-com" href="usuario.html">Registro Usuario</a>
        </li>
        
        <li>
            <a class="link-com" href="tipo-documento.html">Tipo de Documento</a>
        </li>
        <li>
            <a class="link-com" href="aprendiz.html">Aprendiz</a>
        </li>
    
    </ul>
</li>                        </ul>
                        <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Buscar ID o Placa">
                            <button class="btn btn-outline-success" type="submit">Buscar</button>
                        </form>
                    </div>
                </div>
            </nav>

            <h2 class="text-center mb-4">TIPO DOCUMENTO</h2>

            <section class="mb-5 p-3 border rounded bg-light">
                <h5 class="mb-3 text-primary">Nuevo Registro</h5>
                <form class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">ID</label>
                        <input type="text" class="form-control" placeholder="Numero" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">SIGLA</label>
                        <input type="text" class="form-control" placeholder="Ej:C.C" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">NOMBRE DOCUMENTO</label>
                        <input type="text" class="form-control" placeholder="Ej:Cedula" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Estado</label>
                        <select class="form-select">
                            <option selected>Activo</option>
                            <option>Inactivo</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Registrar</button>
                    </div>
                </form>
            </section>

            <div class="table-responsive">
                <table class="table table-hover align-middle shadow-sm">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Sigla</th>
                            <th>Nombre Documento</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>01</td>
                            <td>C.C</td>
                            <td>Cedula de Ciudadania</td>
                            <td><span class="badge bg-success">Activo</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-warning me-1">Editar</button>
                                <button class="btn btn-sm btn-danger">Eliminar</button>
                            </td>
                        </tr>
                        <tr>
                            <td>02</td>
                            <td>T.I</td>
                            <td>Tarjeta de Identidad</td>
                            <td><span class="badge bg-secondary">Inactivo</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-warning me-1">Editar</button>
                                <button class="btn btn-sm btn-danger">Eliminar</button>
                            </td>
                        </tr>
                        <tr>
                            <td>03</td>
                            <td>C.E</td>
                            <td>Cedula de Extranjeria</td>
                            <td><span class="badge bg-success">Activo</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-warning me-1">Editar</button>
                                <button class="btn btn-sm btn-danger">Eliminar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
