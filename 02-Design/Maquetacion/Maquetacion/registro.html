<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Usuario y Vehículo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="Styles/style.css">
</head>

<body>

    <main class="container my-5">
        <div class="card-registro p-4 shadow">
            <h2 class="text-center mb-4">REGISTRO</h2>
            
            <form action="#" method="POST" enctype="multipart/form-data"> <div class="row"> <div class="col-lg-6 pe-lg-4 border-end-lg">
                        <h4 class="section-title">Datos del Propietario</h4>
                        
                        <div class="mb-3"> <label class="form-label"> Primer nombre</label>
                            <input type="text" class="form-control" placeholder="Escriba su nombre" required>
                        </div>

                        <div class="mb-3"> <label class="form-label">Segundo nombre</label>
                            <input type="text" class="form-control" placeholder="Escriba su nombre">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Primer apellido</label>
                            <input type="text" class="form-control" placeholder="Escriba su apellido" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Segundo apellido</label>
                            <input type="text" class="form-control" placeholder="Escriba su apellido">
                        </div>

                        <div class="row g-2 mb-3"> <div class="col-md-4">
                                <label class="form-label">Tipo Doc.</label>
                                <select class="form-select"> <option value="CC">C.C.</option>
                                    <option value="TI">T.I.</option>
                                    <option value="CE">C.E.</option>
                                </select>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Número de Documento</label>
                                <input type="number" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Centro de Formación</label>
                            <input type="text" class="form-control" placeholder="Nombre del centro">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Rol</label>
                                <select class="form-select">
                                    <option value="aprendiz">Aprendiz</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Número de Ficha</label>
                                <input type="number" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Teléfono / Celular</label>
                                <input type="tel" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control">
                            </div>
                        </div>

                        <div class="file-upload-section p-3 mb-3">
                            <p class="small fw-bold text-muted text-uppercase">Documentación Personal</p>
                            <label class="form-label small">Documento Identidad (JPG)</label>
                            <input type="file" class="form-control form-control-sm mb-2" accept=".jpg, .jpeg">
                            
                            <label class="form-label small">Copia de Carnet aprendiz</label>
                            <input type="file" class="form-control form-control-sm mb-2">
                            
                            <label class="form-label small">Foto del Aprendiz (A color)</label>
                            <input type="file" class="form-control form-control-sm">
                        </div>
                    </div>

                    <div class="col-lg-6 ps-lg-4 mt-4 mt-lg-0"> <!--col (columna), lg (large / pantallas grandes),p (padding / espacio interno), s (start / inicio-izquierda),t (top / arriba)-->
                        <h4 class="section-title">Datos del Vehículo</h4>

                        <div class="mb-3">
                            <label class="form-label">Tipo de Vehículo</label>
                            <select class="form-select">
                                <option value="moto">Motocicleta</option>
                                <option value="carro">Automóvil</option>
                                <option value="bici">Bicicleta</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Placa</label>
                                <input type="text" class="form-control" placeholder="ABC-123">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cilindraje</label>
                                <input type="text" class="form-control" placeholder="Ej: 150cc">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Modelo</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Color</label>
                                <input type="text" class="form-control">
                            </div>
                        </div>

                        <div class="file-upload-section-v p-3">
                            <p class="small fw-bold text-muted text-uppercase">Evidencia Visual del Vehículo</p>
                            
                            <label class="form-label small">Foto de la Placa (JPG)</label>
                            <input type="file" class="form-control form-control-sm mb-2" accept=".jpg, .jpeg">

                            <label class="form-label small">Foto Frontal Vehiculo</label>
                            <input type="file" class="form-control form-control-sm mb-2">

                            <label class="form-label small">Foto Lateral Vehiculo</label>
                            <input type="file" class="form-control form-control-sm mb-2">

                            <label class="form-label small">Tarjeta de Propiedad</label>
                            <input type="file" class="form-control form-control-sm">
                        </div>
                    </div>

                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-submit px-5 py-2">GUARDAR</button>
                </div>

            </form>
        </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
